# Render Blueprint: one web service serves the API and the dashboard.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
services:
  - type: web
    name: interfog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENABLE_DEMO
        value: "true"
